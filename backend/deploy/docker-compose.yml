# Production-shaped stack on one host: 2 API replicas, 1 worker, Postgres, Redis, nginx (LB), Prometheus.
# Usage: cp ../.env.example .env && edit && docker compose up --build
x-app: &app
  build: { context: .., dockerfile: Dockerfile }
  env_file: .env
  environment:
    DATABASE_URL: postgres://strawslot:${POSTGRES_PASSWORD:-strawslot}@postgres:5432/strawslot
    REDIS_URL: redis://redis:6379
  depends_on:
    migrate: { condition: service_completed_successfully }
    redis: { condition: service_started }
  restart: unless-stopped
services:
  postgres:
    image: postgres:16-alpine
    environment: { POSTGRES_USER: strawslot, POSTGRES_PASSWORD: "${POSTGRES_PASSWORD:-strawslot}", POSTGRES_DB: strawslot }
    volumes: [pgdata:/var/lib/postgresql/data]
    healthcheck: { test: ["CMD-SHELL", "pg_isready -U strawslot"], interval: 5s, retries: 10 }
  redis:
    image: redis:7-alpine
    command: ["redis-server", "--maxmemory", "256mb", "--maxmemory-policy", "allkeys-lru"]
  migrate:
    <<: *app
    command: ["node", "dist/scripts/migrate.js"]
    restart: "no"
    depends_on: { postgres: { condition: service_healthy } }
  api:
    <<: *app
    environment:
      DATABASE_URL: postgres://strawslot:${POSTGRES_PASSWORD:-strawslot}@postgres:5432/strawslot
      REDIS_URL: redis://redis:6379
      RUN_WORKER_IN_API: "false"
    deploy: { replicas: 2 }
  worker:
    <<: *app
    command: ["node", "dist/worker.js"]
    environment:
      DATABASE_URL: postgres://strawslot:${POSTGRES_PASSWORD:-strawslot}@postgres:5432/strawslot
      REDIS_URL: redis://redis:6379
  nginx:
    image: nginx:1.27-alpine
    volumes: ["./nginx.conf:/etc/nginx/nginx.conf:ro"]
    ports: ["8080:80"]
    depends_on: [api]
  prometheus:
    image: prom/prometheus:v2.54.1
    volumes: ["./prometheus.yml:/etc/prometheus/prometheus.yml:ro"]
    ports: ["9090:9090"]
volumes: { pgdata: {} }
