events { worker_connections 4096; }
http {
  upstream api { server api:8080; keepalive 64; }   # docker DNS round-robins the replicas
  limit_req_zone $binary_remote_addr zone=perip:10m rate=50r/s;
  server {
    listen 80;
    client_max_body_size 1m;
    location /health/ { proxy_pass http://api; }
    location /metrics { deny all; }                  # scrape inside the network, not from the internet
    location / {
      limit_req zone=perip burst=100 nodelay;
      proxy_pass http://api;
      proxy_http_version 1.1; proxy_set_header Connection "";
      proxy_set_header Host $host;
      proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
      proxy_set_header X-Forwarded-Proto $scheme;
      proxy_read_timeout 30s;
    }
  }
}
