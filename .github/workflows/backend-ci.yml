name: backend-ci
on:
  push: { paths: ["backend/**", ".github/workflows/backend-ci.yml"] }
  pull_request: { paths: ["backend/**"] }
jobs:
  test:
    runs-on: ubuntu-latest
    defaults: { run: { working-directory: backend } }
    services:
      postgres:
        image: postgres:16
        env: { POSTGRES_USER: strawslot, POSTGRES_PASSWORD: strawslot, POSTGRES_DB: strawslot_test }
        ports: ["5432:5432"]
        options: --health-cmd "pg_isready -U strawslot" --health-interval 5s --health-retries 10
      redis:
        image: redis:7
        ports: ["6379:6379"]
    env:
      TEST_DATABASE_URL: postgres://strawslot:strawslot@localhost:5432/strawslot_test
      TEST_REDIS_URL: redis://localhost:6379/15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: 22, cache: npm, cache-dependency-path: backend/package-lock.json }
      - run: npm ci
      - run: npm run typecheck
      - run: npm test
      - run: npm run build
