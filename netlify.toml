[build]
  command = "npm run build"
  publish = "dist"
  functions = "netlify/functions"

[functions]
  node_bundler = "none"

# /api now goes to the production backend on Render (Postgres + Redis, see backend/).
# To fall back to the built-in demo function, swap the `to` line for: /.netlify/functions/api/:splat
[[redirects]]
  from = "/api/*"
  to = "https://strawslot-api.onrender.com/api/:splat"
  status = 200
  force = true

[[redirects]]
  from = "/*"
  to = "/index.html"
  status = 200
